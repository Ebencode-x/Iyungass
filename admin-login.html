<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — Iyunga Technical Secondary School</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .auth-card{max-width:360px;width:100%;padding:32px;border:1px solid var(--border);border-radius:10px}
    .auth-card h1{font-size:20px;margin:0 0 4px}
    .auth-card .muted{color:var(--text-muted);font-size:13px;margin:0 0 20px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    .field input{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--border);font-size:14px;font-family:inherit;box-sizing:border-box}
    .field-error{color:var(--accent);font-size:12px;margin-top:4px;display:none}
    .field-error.show{display:block}
    #toast-container{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
    .toast{padding:12px 16px;border-radius:8px;color:var(--accent-text);font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;transform:translateX(20px);transition:opacity .2s ease,transform .2s ease}
    .toast.show{opacity:1;transform:translateX(0)}
    .toast.success{background:var(--bg-header)}
    .toast.error{background:var(--accent)}
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>Admin Sign In</h1>
    <p class="muted">Iyunga Technical Secondary School — staff access only.</p>
    <form id="admin-login-form">
      <div class="field">
        <label>Username</label>
        <input name="username" type="text" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input name="password" type="password" required autocomplete="current-password">
        <div class="field-error" id="err-login">Invalid username or password.</div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign in</button>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script>
    var ADMIN_SESSION_KEY = 'iyungass_current_admin';

    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });
      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 200);
      }, 3000);
    }

    if (localStorage.getItem(ADMIN_SESSION_KEY)) {
      window.location.href = 'admin.html';
    }

    document.getElementById('admin-login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var username = (data.get('username') || '').trim();
      var password = data.get('password') || '';

      document.getElementById('err-login').classList.remove('show');

      fetch(API_BASE + '/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function (res) {
          return res.json().then(function (body) { return { ok: res.ok, body: body }; });
        })
        .then(function (result) {
          if (!result.ok) {
            document.getElementById('err-login').classList.add('show');
            throw new Error(result.body.error || 'Login failed.');
          }
          localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(result.body.admin));
          window.location.href = 'admin.html';
        })
        .catch(function (err) { showToast(err.message, 'error'); });
    });
  </script>
</body>
</html>
