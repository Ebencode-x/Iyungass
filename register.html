<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Iyungass</title>
  <link rel="stylesheet" href="student.css">
  <style>
    main{max-width:720px;margin:48px auto;padding:20px}
    label{display:block;font-size:14px;color:#0f172a;margin-bottom:6px}
    input,select{width:100%;padding:8px;border-radius:6px;border:1px solid #d1d5db}
    input.invalid{border-color:#dc2626}
    button{background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:0;cursor:pointer}
    .field-error{color:#dc2626;font-size:12px;margin-top:4px;display:none}
    .field-error.show{display:block}

    /* Toast notifications */
    #toast-container{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
    .toast{padding:12px 16px;border-radius:8px;color:#fff;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;transform:translateX(20px);transition:opacity .2s ease,transform .2s ease}
    .toast.show{opacity:1;transform:translateX(0)}
    .toast.success{background:#16a34a}
    .toast.error{background:#dc2626}
  </style>
</head>
<body>
  <main>
    <h1>Register</h1>
    <form id="reg" novalidate>
      <div style="margin-bottom:12px;">
        <label>Full name
          <input name="name" type="text" required>
        </label>
        <div class="field-error" id="err-name">Please enter your full name.</div>
      </div>
      <div style="margin-bottom:12px;">
        <label>Email
          <input name="email" type="email" required>
        </label>
        <div class="field-error" id="err-email">Please enter a valid email address.</div>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:12px;">
        <label style="flex:1">Password
          <input name="pass" type="password" required minlength="8">
          <div class="field-error" id="err-pass">Password must be at least 8 characters and include a letter and a number.</div>
        </label>
        <label style="flex:1">Confirm
          <input name="confirm" type="password" required minlength="8">
          <div class="field-error" id="err-confirm">Passwords do not match.</div>
        </label>
      </div>
      <div style="margin-bottom:12px;">
        <label>Course
          <select name="course">
            <option>Intro to HTML</option>
            <option>CSS Fundamentals</option>
            <option>JavaScript Basics</option>
          </select>
        </label>
      </div>
      <div style="margin-bottom:12px;">
        <label><input name="terms" type="checkbox" required> I agree to the terms</label>
        <div class="field-error" id="err-terms">You must agree to the terms to continue.</div>
      </div>
      <div>
        <button type="submit">Create account</button>
      </div>
    </form>
  </main>

  <div id="toast-container"></div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('reg');
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      // at least 8 chars, one letter, one number
      var passRegex = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;

      function showError(fieldName, errId, condition) {
        var input = form.elements[fieldName];
        var errEl = document.getElementById(errId);
        if (condition) {
          input.classList.add('invalid');
          errEl.classList.add('show');
        } else {
          input.classList.remove('invalid');
          errEl.classList.remove('show');
        }
      }

      function showToast(message, type) {
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(function () {
          toast.classList.add('show');
        });
        setTimeout(function () {
          toast.classList.remove('show');
          setTimeout(function () {
            toast.remove();
          }, 200);
        }, 3500);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var data = new FormData(form);

        var name = (data.get('name') || '').trim();
        var email = (data.get('email') || '').trim();
        var pass = data.get('pass') || '';
        var confirm = data.get('confirm') || '';
        var terms = form.elements['terms'].checked;

        var nameInvalid = name.length === 0;
        var emailInvalid = !emailRegex.test(email);
        var passInvalid = !passRegex.test(pass);
        var confirmInvalid = pass !== confirm || confirm.length === 0;
        var termsInvalid = !terms;

        showError('name', 'err-name', nameInvalid);
        showError('email', 'err-email', emailInvalid);
        showError('pass', 'err-pass', passInvalid);
        showError('confirm', 'err-confirm', confirmInvalid);
        showError('terms', 'err-terms', termsInvalid);

        if (nameInvalid || emailInvalid || passInvalid || confirmInvalid || termsInvalid) {
          showToast('Please fix the errors below.', 'error');
          return;
        }

        showToast('Registration successful! (demo — no database connected yet)', 'success');
        form.reset();
      });
    })();
  </script>
</body>
</html>
