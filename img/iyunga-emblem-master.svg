<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sunburst" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C9531E"/>
      <stop offset="55%" stop-color="#E8791F"/>
      <stop offset="100%" stop-color="#F5A431"/>
    </linearGradient>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16305A"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <clipPath id="raysClip">
      <circle cx="256" cy="256" r="188"/>
    </clipPath>
    <!-- bottom arc for curved school name, radius 178, centered 256,256, bowing through the bottom point -->
    <path id="textArc" d="M 101.9,345 A 178,178 0 0 0 410.1,345"/>
  </defs>

  <!-- black disc background -->
  <circle cx="256" cy="256" r="252" fill="#000000"/>
  <circle cx="256" cy="256" r="246" fill="#050505"/>

  <!-- sunburst rays, clipped so they stay contained inside the ring -->
  <g clip-path="url(#raysClip)">
    <g fill="url(#sunburst)">
      <polygon points="256,68 269,222 243,222"/>
      <polygon points="330,90 316,224 293,213"/>
      <polygon points="182,90 196,224 219,213"/>
      <polygon points="384,140 342,238 322,220"/>
      <polygon points="128,140 170,238 190,220"/>
      <polygon points="256,220 296,236 256,262 216,236"/>
    </g>
  </g>

  <!-- navy crescent ring, open at the top -->
  <path d="M 327.8,58.7 A 210,210 0 1 1 184.2,58.7"
        fill="none" stroke="url(#crescentGrad)" stroke-width="34" stroke-linecap="round"/>

  <!-- open book -->
  <g transform="translate(256,262)">
    <path d="M0,-4 C-56,-30 -104,-27 -104,-27 L-104,50 C-104,50 -56,47 0,74
             C56,47 104,50 104,50 L104,-27 C104,-27 56,-30 0,-4 Z"
          fill="#FFFFFF" stroke="#141414" stroke-width="3.2" stroke-linejoin="round"/>
    <line x1="0" y1="-4" x2="0" y2="74" stroke="#141414" stroke-width="3.2"/>
    <path d="M-88,-12 C-67,-21 -38,-21 -13,-10" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-88,4 C-67,-5 -38,-5 -13,6" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-88,20 C-67,11 -38,11 -13,22" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-88,36 C-67,27 -38,27 -13,38" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M88,-12 C67,-21 38,-21 13,-10" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M88,4 C67,-5 38,-5 13,6" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M88,20 C67,11 38,11 13,22" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M88,36 C67,27 38,27 13,38" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Established: 1963, directly below the book -->
  <text x="256" y="357" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="1.2"
        fill="#EDEDED">Established: 1963</text>

  <!-- curved school name following the ring, near the bottom -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700"
        letter-spacing="1.5" fill="#FFFFFF">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">Iyunga Secondary School</textPath>
  </text>
</svg>
