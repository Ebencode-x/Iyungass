<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portal Login — Iyunga Technical Secondary School</title>
  <meta name="description" content="Student portal login for Iyunga Technical Secondary School, Mbeya.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0A1930">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .app-wrap{max-width:440px;margin:80px auto;padding:0 20px}
    .app-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:32px}
    .app-header{margin-bottom:26px;text-align:center}
    .app-header h1{font-size:24px;margin:0 0 6px}
    .app-header p{color:var(--text-muted);font-size:14px;margin:0}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text-main);margin-bottom:6px}
    .field input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--border);font-size:14px;font-family:inherit}
    .field input.invalid{border-color:var(--accent)}
    .field-error{color:var(--accent);font-size:12px;margin-top:4px;display:none}
    .field-error.show{display:block}
    .field-options{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 18px;font-size:13px}
    .field-options label{display:flex;align-items:center;gap:6px;color:var(--text-main);font-weight:400}
    .field-options input{width:auto}
    .field-options a{color:var(--accent);text-decoration:none;font-weight:600}
    .app-actions button{width:100%}
    .portal-note{text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px}
    .portal-note a{color:var(--accent);text-decoration:none;font-weight:600}

    #toast-container{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
    .toast{padding:12px 16px;border-radius:8px;color:var(--accent-text);font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;transform:translateX(20px);transition:opacity .2s ease,transform .2s ease}
    .toast.show{opacity:1;transform:translateX(0)}
    .toast.success{background:var(--bg-header)}
    .toast.error{background:var(--accent)}
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="app-card">
      <div class="app-header">
        <h1>Student Portal</h1>
        <p>Log in with your admission number and password.</p>
      </div>

      <form id="login" novalidate>
        <div class="field">
          <label>Admission number or email</label>
          <input name="identifier" type="text" required autocomplete="username">
          <div class="field-error" id="err-identifier">Please enter your admission number or email.</div>
        </div>

        <div class="field">
          <label>Password</label>
          <input name="password" type="password" required autocomplete="current-password">
          <div class="field-error" id="err-password">Please enter your password.</div>
        </div>

        <div class="field-options">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <div class="app-actions">
          <button type="submit" class="btn btn-primary">Log in</button>
        </div>
      </form>

      <p class="portal-note">Not admitted yet? <a href="register.html">Submit an application</a></p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script>
    (function () {
      'use strict';

      var form = document.getElementById('login');
      var SESSION_KEY = 'iyungass_current_student';

      function showError(fieldName, errId, condition) {
        var input = form.elements[fieldName];
        var errEl = document.getElementById(errId);
        if (condition) {
          input.classList.add('invalid');
          errEl.classList.add('show');
        } else {
          input.classList.remove('invalid');
          errEl.classList.remove('show');
        }
      }

      function showToast(message, type) {
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(function () {
          toast.classList.add('show');
        });
        setTimeout(function () {
          toast.classList.remove('show');
          setTimeout(function () { toast.remove(); }, 200);
        }, 3500);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var submitBtn = form.querySelector('button[type="submit"]');
        var data = new FormData(form);
        var identifier = (data.get('identifier') || '').trim();
        var password = data.get('password') || '';

        var identifierInvalid = identifier.length === 0;
        var passwordInvalid = password.length === 0;

        showError('identifier', 'err-identifier', identifierInvalid);
        showError('password', 'err-password', passwordInvalid);

        if (identifierInvalid || passwordInvalid) {
          showToast('Please fill in both fields.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';

        fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: identifier, password: password })
        })
          .then(function (res) {
            return res.json().then(function (body) { return { ok: res.ok, body: body }; });
          })
          .then(function (result) {
            if (!result.ok) {
              throw new Error(result.body.error || 'Login failed.');
            }
            localStorage.setItem(SESSION_KEY, result.body.student.admission_number);
            showToast('Welcome back, ' + result.body.student.name + '!', 'success');
            setTimeout(function () {
              window.location.href = 'student.html';
            }, 1200);
          })
          .catch(function (err) {
            showToast(err.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log in';
          });
      });
    })();
  </script>
</body>
</html>
